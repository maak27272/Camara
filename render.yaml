services:
  - type: web
    name: micamara
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_STREAM
        value: "false"
      - key: ENABLE_RECORDING
        value: "false"
